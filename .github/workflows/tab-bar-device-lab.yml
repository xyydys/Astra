name: Astra Tab Bar Device Lab
on:
  push:
    branches: ["diagnostic/tab-bar-device-ab"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iphone:
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build independent iPhone app
        shell: bash
        run: |
          set -euo pipefail
          for xcode in /Applications/Xcode_26.6.app /Applications/Xcode_26.5.app; do
            if [ -d "$xcode" ]; then export DEVELOPER_DIR="$xcode/Contents/Developer"; break; fi
          done
          xcodebuild -version
          brew list --versions xcodegen || brew install xcodegen
          cd Tools/TabBarDeviceLab
          xcodegen generate
          xcodebuild -project AstraTabBarLab.xcodeproj -scheme AstraTabBarLab -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/astra-tab-ab" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          app="$RUNNER_TEMP/astra-tab-ab/Build/Products/Release-iphoneos/AstraTabBarLab.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = "xyy.astra.tablab"
          test -x "$app/AstraTabBarLab"
          lipo -verify_arch arm64 "$app/AstraTabBarLab"
          mkdir Payload
          cp -R "$app" Payload/
          /usr/bin/zip -qry Astra-TabBar-AB.ipa Payload
          unzip -t Astra-TabBar-AB.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Astra-TabBar-AB
          path: Tools/TabBarDeviceLab/Astra-TabBar-AB.ipa
          if-no-files-found: error
          retention-days: 14
