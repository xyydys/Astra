name: AstraTabBarLab
options:
  bundleIdPrefix: xyy.astra
  deploymentTarget:
    iOS: "26.0"
targets:
  AstraTabBarLab:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Astra 底栏对照"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: xyy.astra.tablab
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    scheme:
      testTargets: [AstraTabBarLabUITests]
  AstraTabBarLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: AstraTabBarLab
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: xyy.astra.tablab.uitests
        TEST_TARGET_NAME: AstraTabBarLab
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
