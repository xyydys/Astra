name: Astra
options:
  bundleIdPrefix: xyy
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: "2.7.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    DEAD_CODE_STRIPPING: "YES"
targets:
  Astra:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      # Folia 歌词特效（Tools/FoliaEmbed/build.sh 生成），整个目录原样拷进 App
      - path: Embed/folia
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: SwiftSoup
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [audio]
        # Documents 在「文件」App 里可见（备份文件放在 Documents/备份）
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsArbitraryLoadsForMedia: true
    settings:
      base:
        # 包名和显示名可以在编译时覆盖（CI 手动运行时可填），例如用旧包名编一版覆盖安装来导出备份
        APP_BUNDLE_ID: xyy.astra
        APP_DISPLAY_NAME: Astra
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: Astra
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 设置里可切换的备选图标（Resources/Assets.xcassets 里其余的 AppIcon-*）
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets: [AstraUITests]
  # 模拟器里复现问题用的 UI 测试（Actions 里手动运行「UI Test」）
  AstraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/AstraUITests
    dependencies:
      - target: Astra
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: xyy.astra.uitests
        TEST_TARGET_NAME: Astra
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
  NovelEngineCLI:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Novel/Engine
      - path: Sources/Services/Net.swift
      - path: Tools/NovelEngineCLI
    dependencies:
      - package: SwiftSoup
    settings:
      base:
        PRODUCT_NAME: novel-engine
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
    scheme: {}
